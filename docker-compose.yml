version: '3.8'

services:
  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: probuy-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - probuy-network
    depends_on:
      - postgres
      - redis

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: probuy-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - probuy-network
    depends_on:
      - app

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: probuy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: probuy
      POSTGRES_USER: probuy
      POSTGRES_PASSWORD: probuy_secret
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - probuy-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: probuy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - probuy-network

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: probuy-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --queue=high,default,low,maintenance --tries=3 --timeout=90
    volumes:
      - ./:/var/www
    networks:
      - probuy-network
    depends_on:
      - app
      - redis
      - postgres

  # Scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: probuy-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./:/var/www
    networks:
      - probuy-network
    depends_on:
      - app
      - redis
      - postgres

  # Laravel Horizon (optional - for queue monitoring)
  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: probuy-horizon
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan horizon
    volumes:
      - ./:/var/www
    networks:
      - probuy-network
    depends_on:
      - app
      - redis
      - postgres

networks:
  probuy-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
