repos:
  - repo: local
    hooks:
      - id: run-rector
        name: Rector
        entry: vendor/bin/rector process
        language: system
        types: [php]
        pass_filenames: false # Run on the entire codebase, not just staged files
        always_run: true

      - id: run-pint
        name: Laravel Pint
        entry: vendor/bin/pint
        language: system
        types: [php]
        pass_filenames: false # Run on the entire codebase, not just staged files
        always_run: true
